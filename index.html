<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Compa Chambeador 🌮</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--text:#e8eaf0;--muted:#8b93a7;--accent:#7c9cff;--user:#1f2a4a}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0 auto 0 0}
  select,button,label.btn{background:#222736;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  button:hover,label.btn:hover{border-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  #chat{flex:1;overflow-y:auto;padding:20px 16px}
  .wrap{max-width:820px;margin:0 auto}
  .msg{margin:14px 0;padding:12px 16px;border-radius:12px;border:1px solid var(--line);overflow-wrap:anywhere}
  .msg.user{background:var(--user);margin-left:12%}
  .msg.bot{background:var(--panel);margin-right:4%}
  .msg p{margin:.5em 0}
  pre{position:relative;background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
  code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
  :not(pre)>code{background:#0b0d13;padding:1px 5px;border-radius:4px}
  pre button{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:12px}
  .tool{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);background:#12151d;color:var(--muted);font-size:13px;white-space:pre-wrap}
  footer{padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
  .row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:200px;min-height:44px;background:#0f1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
  textarea:focus{outline:none;border-color:var(--accent)}
  #send{background:var(--accent);color:#0b0d13;border:none;font-weight:600}
  #files{max-width:820px;margin:0 auto 6px;color:var(--muted);font-size:12px}
  table{border-collapse:collapse}td,th{border:1px solid var(--line);padding:4px 8px}
</style>
</head>
<body>
<header>
  <h1>🌮 El Compa Chambeador <small id="info" style="color:var(--muted);font-weight:400"></small></h1>
  <select id="mode" title="Modo">
    <option value="general">💬 Echando plática</option>
    <option value="programador">💻 A darle al código</option>
    <option value="examen">📝 Salvando el examen</option>
    <option value="investigador">🔎 Investigando el chisme</option>
  </select>
  <label class="chk"><input type="checkbox" id="web"> Búsqueda web</label>
  <label class="chk" id="agentBox" style="display:none"><input type="checkbox" id="agent"> Modo agente (ejecuta Python)</label>
  <button id="clear">🗑 Borrón y cuenta nueva</button>
</header>

<div id="chat"><div class="wrap" id="log"></div></div>

<footer>
  <div id="files"></div>
  <div class="row">
    <label class="btn" title="Adjuntar archivo de texto/código">📎<input type="file" id="file" multiple hidden></label>
    <button id="mic" title="Dictar por voz">🎤</button>
    <textarea id="input" rows="1" placeholder="Dime, compa, ¿en qué te echo la mano? (Enter envía, Shift+Enter salto de línea)"></textarea>
    <button id="send">Enviar</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), chat = $("chat"), input = $("input");
let history = JSON.parse(localStorage.getItem("hist") || "[]");
let attachments = [];
let busy = false;

const md = t => (window.marked ? marked.parse(t) : "<pre>" + t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) + "</pre>");

function decorate(el){
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector("button")) return;
    const b = document.createElement("button"); b.textContent = "Copiar";
    b.onclick = () => { navigator.clipboard.writeText(pre.innerText.replace(/Copiar$/, "").trim()); b.textContent = "✓"; setTimeout(()=>b.textContent="Copiar",1200); };
    pre.appendChild(b);
  });
}
function addMsg(role, text){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") d.textContent = text; else { d.innerHTML = md(text); decorate(d); }
  log.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function save(){ localStorage.setItem("hist", JSON.stringify(history)); }
function render(){ log.innerHTML = ""; history.forEach(m => addMsg(m.role === "user" ? "user" : "bot", m.content)); }

async function send(){
  const text = input.value.trim();
  if ((!text && !attachments.length) || busy) return;
  busy = true; $("send").disabled = true;
  let content = text;
  attachments.forEach(a => content += `\n\n[Archivo: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``);
  attachments = []; $("files").textContent = ""; input.value = ""; input.style.height = "auto";
  history.push({role: "user", content}); addMsg("user", content);

  let bot = addMsg("bot", "…"), acc = "";
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages: history, mode: $("mode").value, web: $("web").checked, agent: $("agent").checked})});
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true){
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const p of parts){
        if (!p.startsWith("data: ")) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === "text"){ acc += ev.text; bot.innerHTML = md(acc); decorate(bot); }
        else if (ev.type === "tool"){ const t = document.createElement("div"); t.className="tool"; t.textContent = "⚙️ Ejecutando Python:\n" + ev.code; log.appendChild(t); bot = addMsg("bot","…"); acc = ""; }
        else if (ev.type === "tool_result"){ const t = document.createElement("div"); t.className="tool"; t.textContent = "↳ Resultado:\n" + ev.output; log.insertBefore(t, bot); }
        else if (ev.type === "error"){ bot.innerHTML = "⚠️ " + ev.message; }
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (acc) history.push({role:"assistant", content: acc});
    save();
  } catch(e){ bot.textContent = "⚠️ Error de conexión: " + e.message; }
  busy = false; $("send").disabled = false; input.focus();
}

$("send").onclick = send;
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
$("clear").onclick = () => { history = []; save(); render(); };
$("file").onchange = async e => {
  for (const f of e.target.files) attachments.push({name: f.name, text: await f.text()});
  $("files").textContent = "Adjuntos: " + attachments.map(a => a.name).join(", "); e.target.value = "";
};

// Voz
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR){
  const rec = new SR(); rec.lang = "es-MX"; rec.interimResults = false;
  rec.onresult = e => { input.value += (input.value ? " " : "") + e.results[0][0].transcript; };
  $("mic").onclick = () => rec.start();
} else $("mic").style.display = "none";

fetch("/api/config").then(r => r.json()).then(c => {
  $("info").textContent = "· " + c.model;
  if (c.exec) $("agentBox").style.display = "flex";
}).catch(()=>{});
render();
</script>
</body>
</html>
